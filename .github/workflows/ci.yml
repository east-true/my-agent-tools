name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--all --full-history" .
      - name: Scan checkout
        if: ${{ !cancelled() }}
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: tools
          - os: macos-latest
            binary: tools
          - os: windows-latest
            binary: tools.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check report and experiment helpers
        run: python -m unittest discover -s scripts/benchmarks -p "test_*.py"
      - name: Test and produce structured report
        run: >-
          python scripts/benchmarks/workflow_reports.py capture-go
          --repo "${{ github.repository }}"
          --revision "${{ github.sha }}"
          --job "ci/test/${{ matrix.os }}"
          --run-id "${{ github.run_id }}:${{ github.run_attempt }}"
          --output artifacts/ci-report.json
      - run: go vet ./...
      - run: go build -o ${{ matrix.binary }} ./cmd/tools
      - name: Scan structured report
        id: report_scan
        if: ${{ !cancelled() && hashFiles('artifacts/ci-report.json') != '' }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --config .gitleaks.toml --redact --no-banner artifacts
      - name: Upload structured report
        if: ${{ !cancelled() && steps.report_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-ci-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/ci-report.json
          if-no-files-found: error
          retention-days: 7

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./scripts/build
