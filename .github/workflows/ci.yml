name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--all --full-history" .
      - name: Scan checkout
        if: ${{ !cancelled() }}
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: tools
          - os: macos-latest
            binary: tools
          - os: windows-latest
            binary: tools.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install benchmark validation dependency
        run: python -m pip install --require-hashes -r scripts/benchmarks/requirements.txt
      - name: Check report and experiment helpers
        run: python -m unittest discover -s scripts/benchmarks -p "test_*.py"
      - name: Test and produce structured report
        run: >-
          python scripts/benchmarks/workflow_reports.py capture-go
          --repo "${{ github.repository }}"
          --revision "${{ github.sha }}"
          --job "ci/test/${{ matrix.os }}"
          --run-id "${{ github.run_id }}:${{ github.run_attempt }}"
          --output artifacts/ci-report.json
      - run: go vet ./...
      - run: go build -o ${{ matrix.binary }} ./cmd/tools
      - name: Scan structured report
        id: report_scan
        if: ${{ !cancelled() && hashFiles('artifacts/ci-report.json') != '' }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --config .gitleaks.toml --redact --no-banner artifacts
      - name: Upload structured report
        if: ${{ !cancelled() && steps.report_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-ci-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/ci-report.json
          if-no-files-found: error
          retention-days: 7

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./scripts/build
      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [gitleaks, test, cross-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist/
      - name: Package release binaries
        run: |
          mkdir release-assets
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            chmod +x "dist/$target/tools"
            tar -czf "release-assets/tools-$target.tar.gz" -C "dist/$target" tools
          done
          for target in windows-amd64 windows-arm64; do
            (cd "dist/$target" && zip "../../release-assets/tools-$target.zip" tools.exe)
          done
          (cd release-assets && sha256sum tools-* > SHA256SUMS)
      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
